services:
  - type: web
    name: toanspacex
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_MODEL
        value: gemini-2.5-pro
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
